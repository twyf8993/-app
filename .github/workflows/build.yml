name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find and extract ZIP
        shell: bash
        run: |
          mapfile -t zips < <(
            find . -path ./.git -prune -o -type f -iname '*.zip' -print
          )

          if [ "${#zips[@]}" -ne 1 ]; then
            echo "错误：仓库中必须恰好有一个 ZIP 文件，实际找到 ${#zips[@]} 个"
            printf '%s\n' "${zips[@]}"
            exit 1
          fi

          echo "解压：${zips[0]}"
          unzip -q "${zips[0]}" -d work

          # 取层级最浅的 settings.gradle(.kts) 所在目录作为项目根目录，忽略 Mac 压缩包里的 __MACOSX
          project=$(
            find work -path '*/__MACOSX' -prune -o -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%d %h\n' \
              | sort -n | head -n 1 | cut -d' ' -f2-
          )

          if [ -z "$project" ]; then
            echo "错误：ZIP 中没有找到 Gradle 项目（settings.gradle 或 settings.gradle.kts）"
            exit 1
          fi

          echo "项目目录：$project"
          echo "PROJECT_DIR=$project" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 缓存调试签名，以后每次构建的 APK 签名一致，可以直接覆盖安装
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Create debug signing key if missing
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          # 项目自带完整的 gradlew 时用项目指定的 Gradle 版本，否则用上面安装的 Gradle
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          find "$PROJECT_DIR" -path '*/build/outputs/apk/debug/*.apk' -exec cp {} dist/ \;
          ls -l dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: dist/*.apk
          if-no-files-found: error

      # 发布到 Releases，手机上直接点 APK 下载安装，不用再解压
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 测试版 第${{ github.run_number }}次构建
          files: dist/*.apk
          make_latest: true
