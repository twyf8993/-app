          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.drawWithCache
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Shadow
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.drawText
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.rememberTextMeasurer
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.Constraints
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import coil.compose.AsyncImagePainter
          import coil.compose.rememberAsyncImagePainter
          import com.shiguang.video.data.Drama
          import com.shiguang.video.ui.theme.AppColors

          private val PosterPalettes = listOf(
              listOf(Color(0xFF3A1C71), Color(0xFFD76D77), Color(0xFFFFAF7B)),
              listOf(Color(0xFF0F2027), Color(0xFF203A43), Color(0xFF2C5364)),
              listOf(Color(0xFF42275A), Color(0xFF734B6D)),
              listOf(Color(0xFF134E5E), Color(0xFF71B280)),
              listOf(Color(0xFF8E2DE2), Color(0xFF4A00E0)),
              listOf(Color(0xFF7F1D1D), Color(0xFFB45309), Color(0xFFF59E0B)),
              listOf(Color(0xFF1F1C2C), Color(0xFF928DAB)),
              listOf(Color(0xFF16222A), Color(0xFF3A6073)),
              listOf(Color(0xFF603813), Color(0xFFB29F94)),
              listOf(Color(0xFF232526), Color(0xFF414345), Color(0xFF8E0E00)),
          )

          /**
           * 剧集海报：数据源给了 [Drama.coverUrl] 就加载网络封面，
           * 没有链接、还在加载或者加载失败时，显示下面程序生成的占位海报。
           */
          @Composable
          fun Poster(
              drama: Drama,
              modifier: Modifier = Modifier,
              corner: Dp = 10.dp,
              showTitle: Boolean = true,
              badge: String? = null,
              progress: Float? = null,
          ) {
              Box(modifier.clip(RoundedCornerShape(corner))) {
                  GeneratedPoster(drama, showTitle, Modifier.fillMaxSize())
                  CoverImage(drama.coverUrl, Modifier.fillMaxSize())

                  if (badge != null) {
                      Text(
                          text = badge,
                          modifier = Modifier
                              .align(Alignment.TopStart)
                              .padding(6.dp)
                              .clip(RoundedCornerShape(50))
                              .background(AppColors.Online)
                              .padding(horizontal = 8.dp, vertical = 2.dp),
                          color = Color.White,
                          fontSize = 11.sp,
                          fontWeight = FontWeight.Bold,
                      )
                  }

                  Text(
                      text = drama.type.label,
                      modifier = Modifier
                          .align(Alignment.TopEnd)
                          .padding(6.dp)
                          .clip(RoundedCornerShape(4.dp))
                          .background(Color.Black.copy(alpha = 0.35f))
                          .padding(horizontal = 5.dp, vertical = 1.dp),
                      color = Color.White.copy(alpha = 0.85f),
                      fontSize = 10.sp,
                  )

                  if (progress != null) {
                      ProgressStrip(progress, Modifier.align(Alignment.BottomCenter).fillMaxWidth())
                  }
              }
          }

          /** 只在图片真正加载成功后覆盖上去，失败时下面的占位海报照常显示 */
          @Composable
          private fun CoverImage(url: String?, modifier: Modifier = Modifier) {
              if (url.isNullOrBlank()) return
              val painter = rememberAsyncImagePainter(model = url)
              if (painter.state is AsyncImagePainter.State.Success) {
                  Image(
                      painter = painter,
                      contentDescription = null,
                      contentScale = ContentScale.Crop,
                      modifier = modifier,
                  )
              }
          }

          /**
           * 程序生成的占位海报：渐变底色 + 几何纹理 + 片名水印。
           * 底图和文字都在一次绘制里完成，只在尺寸或内容变化时重新排版，列表滚动时开销很小。
           */
          @Composable
          private fun GeneratedPoster(drama: Drama, showTitle: Boolean, modifier: Modifier = Modifier) {
              val colors = PosterPalettes[drama.posterSeed.mod(PosterPalettes.size)]
              val variant = drama.posterSeed % 3
              val textMeasurer = rememberTextMeasurer()
              Box(
                  modifier.drawWithCache {
                      val w = size.width
                      val h = size.height
                      val r = size.minDimension
                      val widthDp = w.toDp().value
                      val background = Brush.linearGradient(colors)
                      val shade = Brush.verticalGradient(
                          listOf(Color.Transparent, Color.Black.copy(alpha = 0.7f)),
                          startY = h * 0.45f,
                          endY = h,
                      )
                      val mark = textMeasurer.measure(
                          drama.title.take(1),
                          TextStyle(
                              color = Color.White.copy(alpha = 0.16f),
                              fontSize = (widthDp * 0.62f).sp,
                              fontWeight = FontWeight.Black,
                          ),
                      )
                      val sidePadding = 8.dp.toPx()
                      val title = if (showTitle) {
                          textMeasurer.measure(
                              drama.title,
                              TextStyle(
                                  color = Color.White,
                                  fontSize = widthDp.times(0.12f).coerceIn(11f, 28f).sp,
                                  lineHeight = widthDp.times(0.15f).coerceIn(14f, 34f).sp,
                                  fontWeight = FontWeight.ExtraBold,
                                  textAlign = TextAlign.Center,
                              ),
                              overflow = TextOverflow.Ellipsis,
                              maxLines = 2,
                              constraints = Constraints.fixedWidth((w - sidePadding * 2).toInt().coerceAtLeast(0)),
                          )
                      } else {
                          null
                      }
                      val titleShadow = Shadow(Color.Black.copy(alpha = 0.6f), Offset(0f, 2f), 6f)

                      onDrawBehind {
                          drawRect(background)
                          when (variant) {
                              0 -> {
                                  drawCircle(Color.White.copy(alpha = 0.12f), r * 0.55f, Offset(w * 0.85f, h * 0.18f))
                                  drawCircle(Color.White.copy(alpha = 0.06f), r * 0.85f, Offset(w * 0.05f, h * 0.7f))
                              }
                              1 -> {
                                  drawCircle(Color.White.copy(alpha = 0.10f), r * 0.35f, Offset(w * 0.5f, h * 0.32f))
                                  drawCircle(Color.White.copy(alpha = 0.05f), r * 0.6f, Offset(w * 0.5f, h * 0.32f))
                              }
                              else -> {
                                  for (i in 0..5) {
                                      val y = h * (0.1f + i * 0.09f)
                                      drawLine(Color.White.copy(alpha = 0.07f), Offset(0f, y + w * 0.3f), Offset(w, y), strokeWidth = r * 0.03f)
                                  }
                              }
                          }
                          drawRect(shade)
                          drawText(
                              mark,
                              topLeft = Offset((w - mark.size.width) / 2f, (h - mark.size.height) / 2f - h * 0.1f),
                          )
                          if (title != null) {
                              drawText(
                                  title,
                                  topLeft = Offset(sidePadding, h - w * 0.08f - title.size.height),
                                  shadow = titleShadow,
                              )
                          }
                      }
                  },
              )
          }
