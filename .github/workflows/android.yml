          import com.shiguang.video.data.source.SourceError
          import com.shiguang.video.data.source.SourceResult
          import com.shiguang.video.data.source.retryable
          import com.shiguang.video.data.source.userMessage
          import com.shiguang.video.ui.theme.AppColors
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.launch

          /** 界面取得的数据源。界面只认这个接口，不认识具体实现 */
          @Composable
          fun rememberContentSource(): ContentSource {
              val context = LocalContext.current
              return remember(context) { context.app.contentSource }
          }

          /** 界面从数据源取数据时的三种状态 */
          sealed interface SourceState<out T> {
              data object Loading : SourceState<Nothing>

              data class Ready<T>(val value: T) : SourceState<T>

              data class Failed(val error: SourceError) : SourceState<Nothing>
          }

          private fun <T> SourceResult<T>.toState(): SourceState<T> = when (this) {
              is SourceResult.Ok -> SourceState.Ready(value)
              is SourceResult.Err -> SourceState.Failed(error)
          }

          /** 承载一次数据源请求，[retry] 让界面重新请求 */
          @Stable
          class SourceStateHolder<T> {
              var state by mutableStateOf<SourceState<T>>(SourceState.Loading)
                  internal set

              internal var attempt by mutableIntStateOf(0)

              fun retry() {
                  attempt++
              }
          }

          /** 请求一次数据。key 变化时重新请求；出错时可通过 [SourceStateHolder.retry] 重试。 */
          @Composable
          fun <T> rememberSourceState(
              vararg keys: Any?,
              load: suspend () -> SourceResult<T>,
          ): SourceStateHolder<T> {
              val holder = remember(*keys) { SourceStateHolder<T>() }
              LaunchedEffect(holder, holder.attempt) {
                  holder.state = SourceState.Loading
                  holder.state = load().toState()
              }
              return holder
          }

          /**
           * 游标分页列表：首屏加载、滚到底部加载下一页、出错重试。
           * 界面只接触 [items]，不知道数据来自哪个实现。
           */
          @Stable
          class PagerStateHolder<T>(
              private val scope: CoroutineScope,
              private val fetch: suspend (cursor: String?) -> SourceResult<Page<T>>,
          ) {
              var items by mutableStateOf<List<T>>(emptyList())
                  private set

              var loading by mutableStateOf(false)
                  private set

              var error by mutableStateOf<SourceError?>(null)
                  private set

              var exhausted by mutableStateOf(false)
                  private set

              private var cursor: String? = null
              private var job: Job? = null

              val hasMore: Boolean get() = !exhausted

              /** 换筛选条件时调用：清空并重新加载第一页 */
              fun reload() {
                  items = emptyList()
                  cursor = null
                  exhausted = false
                  error = null
                  job?.cancel()
                  job = scope.launch { fetchPage() }
              }

              /** 加载下一页；正在加载或已经到底时不重复请求 */
              fun loadMore() {
                  if (job?.isActive == true || exhausted) return
                  job = scope.launch { fetchPage() }
              }

              fun retry() {
                  error = null
                  loadMore()
              }

              private suspend fun fetchPage() {
                  loading = true
                  error = null
                  when (val result = fetch(cursor)) {
                      is SourceResult.Ok -> {
                          items = items + result.value.items
                          cursor = result.value.nextCursor
                          exhausted = cursor == null
                      }
                      is SourceResult.Err -> error = result.error
                  }
                  loading = false
              }
          }

          @Composable
          fun <T> rememberPager(
              vararg keys: Any?,
              fetch: suspend (cursor: String?) -> SourceResult<Page<T>>,
          ): PagerStateHolder<T> {
              val scope = rememberCoroutineScope()
              val holder = remember(*keys) { PagerStateHolder(scope, fetch) }
              LaunchedEffect(holder) { holder.reload() }
              return holder
          }

          /** 列表底部的翻页提示：滚到这里就自动取下一页，出错时可重试 */
          @Composable
          fun PagerFooter(pager: PagerStateHolder<*>, modifier: Modifier = Modifier) {
              val error = pager.error
              Box(
                  modifier
                      .fillMaxWidth()
                      .padding(vertical = 16.dp),
                  contentAlignment = Alignment.Center,
              ) {
                  when {
                      error != null -> SourceErrorState(
                          error = error,
                          onRetry = pager::retry,
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(8.dp),
                      )

                      pager.hasMore -> {
                          // 这个条目被组合出来，说明用户已经滚到列表底部
                          LaunchedEffect(pager.items.size) { pager.loadMore() }
                          CircularProgressIndicator(
                              color = AppColors.Accent,
                              strokeWidth = 2.dp,
                              modifier = Modifier.size(22.dp),
                          )
                      }

                      pager.items.isNotEmpty() -> Text("没有更多了", color = AppColors.TextSecondary, fontSize = 12.sp)
                  }
              }
          }

          @Composable
          fun SourceLoading(modifier: Modifier = Modifier.fillMaxSize()) {
              Box(modifier, contentAlignment = Alignment.Center) {
                  CircularProgressIndicator(
                      color = AppColors.Accent,
                      strokeWidth = 2.dp,
                      modifier = Modifier.size(28.dp),
                  )
              }
          }

          /** 出错提示。只有请求本身值得重试（网络、频率限制）时才给出重试按钮 */
          @Composable
          fun SourceErrorState(
              error: SourceError,
              onRetry: () -> Unit,
              modifier: Modifier = Modifier.fillMaxSize(),
          ) {
              Column(
                  modifier.padding(40.dp),
                  verticalArrangement = Arrangement.Center,
                  horizontalAlignment = Alignment.CenterHorizontally,
              ) {
                  Text(error.userMessage, color = AppColors.TextSecondary, fontSize = 14.sp, textAlign = TextAlign.Center)
                  if (error.retryable) {
                      Spacer(Modifier.height(12.dp))
                      Text(
                          text = "重试",
                          color = AppColors.Accent,
                          fontSize = 14.sp,
                          modifier = Modifier
                              .clip(RoundedCornerShape(50))
                              .clickable(onClick = onRetry)
                              .padding(horizontal = 18.dp, vertical = 8.dp),
                      )
                  }
              }
          }
          __EOF__

