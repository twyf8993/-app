          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.shiguang.video.data.ContentType
          import com.shiguang.video.data.source.CatalogQuery
          import com.shiguang.video.data.source.CatalogSort
          import com.shiguang.video.ui.components.DramaCard
          import com.shiguang.video.ui.components.EmptyState
          import com.shiguang.video.ui.components.PagerFooter
          import com.shiguang.video.ui.components.Pill
          import com.shiguang.video.ui.components.SourceErrorState
          import com.shiguang.video.ui.components.SourceLoading
          import com.shiguang.video.ui.components.SourceState
          import com.shiguang.video.ui.components.bottomContentPadding
          import com.shiguang.video.ui.components.rememberContentSource
          import com.shiguang.video.ui.components.rememberPager
          import com.shiguang.video.ui.components.rememberSourceState
          import com.shiguang.video.ui.theme.AppColors

          enum class SortOrder(val label: String) {
              HOT("最热"),
              NEWEST("最新"),
              SCORE("好评"),
          }

          fun SortOrder.toCatalogSort(): CatalogSort = when (this) {
              SortOrder.HOT -> CatalogSort.HOT
              SortOrder.NEWEST -> CatalogSort.NEWEST
              SortOrder.SCORE -> CatalogSort.SCORE
          }

          data class CategoryFilter(
              val type: ContentType? = null,
              val genre: String? = null,
              val sort: SortOrder = SortOrder.HOT,
          )

          @Composable
          fun CategoryScreen(
              filter: CategoryFilter,
              onFilterChange: (CategoryFilter) -> Unit,
              onOpenDrama: (String) -> Unit,
          ) {
              val source = rememberContentSource()
              val genreState = rememberSourceState { source.genres() }
              val genres = (genreState.state as? SourceState.Ready)?.value.orEmpty()

              val query = CatalogQuery(
                  type = filter.type,
                  genre = filter.genre,
                  sort = filter.sort.toCatalogSort(),
              )
              val pager = rememberPager(query.type, query.genre, query.sort) { cursor ->
                  source.catalog(query, cursor)
              }

              LazyVerticalGrid(
                  columns = GridCells.Fixed(3),
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(start = 20.dp, end = 20.dp, bottom = bottomContentPadding()),
                  horizontalArrangement = Arrangement.spacedBy(12.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp),
              ) {
                  item(span = { GridItemSpan(maxLineSpan) }) {
                      Column(
                          Modifier
                              .statusBarsPadding()
                              .padding(top = 16.dp),
                          verticalArrangement = Arrangement.spacedBy(12.dp),
                      ) {
                          Text("分类筛选", fontSize = 26.sp, fontWeight = FontWeight.Black, color = AppColors.TextPrimary)
                          FilterRow(
                              label = "类型",
                              options = listOf<ContentType?>(null) + ContentType.entries,
                              selected = filter.type,
                              text = { it?.label ?: "全部" },
                              onSelect = { onFilterChange(filter.copy(type = it)) },
                          )
                          FilterRow(
                              label = "题材",
                              options = listOf<String?>(null) + genres,
                              selected = filter.genre,
                              text = { it ?: "全部" },
                              onSelect = { onFilterChange(filter.copy(genre = it)) },
                          )
                          FilterRow(
                              label = "排序",
                              options = SortOrder.entries,
                              selected = filter.sort,
                              text = { it.label },
                              onSelect = { onFilterChange(filter.copy(sort = it)) },
                          )
                          Text(
                              "共 ${pager.items.size}${if (pager.hasMore) "+" else ""} 部",
                              fontSize = 13.sp,
                              color = AppColors.TextSecondary,
                          )
                      }
                  }

                  if (pager.items.isEmpty()) {
                      item(span = { GridItemSpan(maxLineSpan) }) {
                          when (val error = pager.error) {
                              null -> SourceLoading(
                                  Modifier
                                      .fillMaxSize()
                                      .padding(vertical = 40.dp),
                              )
                              else -> SourceErrorState(
                                  error = error,
                                  onRetry = pager::retry,
                                  modifier = Modifier.padding(vertical = 24.dp),
                              )
                          }
                      }
                  }

                  items(pager.items, key = { it.id }) { d ->
                      DramaCard(
                          drama = d,
                          subtitle = if (filter.sort == SortOrder.SCORE) "${d.score}分 · ${d.episodeText}" else d.heatText,
                          onClick = { onOpenDrama(d.id) },
                      )
                  }

                  if (pager.items.isNotEmpty()) {
                      item(span = { GridItemSpan(maxLineSpan) }) {
                          PagerFooter(pager)
                      }
                  }
              }
          }

          @Composable
          private fun <T> FilterRow(
              label: String,
              options: List<T>,
              selected: T,
              text: (T) -> String,
              onSelect: (T) -> Unit,
          ) {
              Row(verticalAlignment = Alignment.CenterVertically) {
                  Text(label, fontSize = 13.sp, color = AppColors.TextSecondary, modifier = Modifier.width(40.dp))
                  LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp), contentPadding = PaddingValues(end = 8.dp)) {
                      items(options) { option ->
                          Pill(text(option), option == selected, { onSelect(option) })
                      }
                  }
              }
          }
          __EOF__

