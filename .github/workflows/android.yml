          f $S/data/source/PlaybackGuard.kt <<'__EOF__'
          package com.shiguang.video.data.source

          /**
           * 播放前的检查：只挑选本应用能合法直接播放的流。
           *
           * 加密流、需要登录或付费的内容一律返回错误交给界面提示，不在这里尝试解密或绕过。
           */
          object PlaybackGuard {

              fun checkAccess(episode: EpisodeInfo): SourceError? = when (episode.access) {
                  EpisodeAccess.FREE -> null
                  EpisodeAccess.LOGIN_REQUIRED -> SourceError.LoginRequired
                  EpisodeAccess.PAID -> SourceError.PaymentRequired
              }

              /** 选出不超过 [maxHeight] 的最高清晰度未加密流；高度未知的流排在最后作为兜底 */
              fun selectStream(
                  playback: Playback,
                  nowMillis: Long,
                  maxHeight: Int = 1080,
              ): SourceResult<VideoStream> {
                  val expiresAt = playback.expiresAtMillis
                  if (expiresAt != null && nowMillis >= expiresAt) return SourceResult.Err(SourceError.Expired)

                  val open = playback.streams.filterNot { it.protected }
                  if (open.isEmpty()) {
                      val error = if (playback.streams.isEmpty()) SourceError.NotFound else SourceError.DrmProtected
                      return SourceResult.Err(error)
                  }

                  val best = open.filter { it.height != null && it.height <= maxHeight }.maxByOrNull { it.height!! }
                      ?: open.firstOrNull { it.height == null }
                      ?: open.minBy { it.height!! }
                  return SourceResult.Ok(best)
              }
          }
