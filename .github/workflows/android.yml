          package com.shiguang.video.data.source

          import com.shiguang.video.data.Drama
          import com.shiguang.video.data.MockCatalog

          /**
           * 第一阶段的模拟片库包装成数据源：片名、简介为虚构内容，视频是 Blender 开放电影。
           * 分页规则与真实接口一致（游标分页），用来验证界面的翻页和错误处理。
           */
          class MockContentSource(
              private val pageSize: Int = 20,
          ) : ContentSource {

              override val info = SourceInfo(
                  name = "本地模拟数据",
                  licenseNote = "片名、简介均为虚构内容，海报由程序生成；视频为 Blender 基金会开放电影（CC BY）。",
              )

              override suspend fun catalog(query: CatalogQuery, cursor: String?): SourceResult<Page<Drama>> {
                  val filtered = MockCatalog.dramas.filter { d ->
                      (query.type == null || d.type == query.type) &&
                          (query.genre == null || query.genre in d.genres)
                  }
                  val sorted = when (query.sort) {
                      CatalogSort.HOT -> filtered.sortedByDescending { it.heat }
                      CatalogSort.NEWEST -> filtered.sortedWith(compareBy<Drama> { it.updatedDaysAgo }.thenByDescending { it.heat })
                      CatalogSort.SCORE -> filtered.sortedByDescending { it.score }
                  }
                  return paginate(sorted, cursor)
              }

              override suspend fun search(keyword: String, cursor: String?): SourceResult<Page<Drama>> =
                  paginate(MockCatalog.search(keyword), cursor)

              override suspend fun hotKeywords(): SourceResult<List<String>> = SourceResult.Ok(MockCatalog.hotKeywords)

              override suspend fun genres(): SourceResult<List<String>> = SourceResult.Ok(MockCatalog.genres)

              override suspend fun series(id: String): SourceResult<Drama> =
                  MockCatalog.find(id)?.let { SourceResult.Ok(it) } ?: SourceResult.Err(SourceError.NotFound)

              override suspend fun related(id: String, limit: Int): SourceResult<List<Drama>> =
                  series(id).map { MockCatalog.related(it, limit) }

              override suspend fun episodes(id: String, cursor: String?): SourceResult<Page<EpisodeInfo>> {
                  val drama = MockCatalog.find(id) ?: return SourceResult.Err(SourceError.NotFound)
                  val all = (1..drama.episodeCount).map { n ->
                      val episode = MockCatalog.episode(drama, n)
                      EpisodeInfo(drama.id, n, episode.title)
                  }
                  return paginate(all, cursor)
              }

              override suspend fun playback(id: String, episode: Int): SourceResult<Playback> {
                  val drama = MockCatalog.find(id) ?: return SourceResult.Err(SourceError.NotFound)
                  if (episode !in 1..drama.episodeCount) return SourceResult.Err(SourceError.NotFound)
                  val video = MockCatalog.episode(drama, episode).video
                  return SourceResult.Ok(
                      Playback(
                          dramaId = id,
                          episode = episode,
                          streams = listOf(VideoStream(video.url)),
                          credit = video.credit,
                      ),
                  )
              }

              /** 游标就是下一页的起始位置 */
              private fun <T> paginate(all: List<T>, cursor: String?): SourceResult<Page<T>> {
                  val start = when (cursor) {
                      null -> 0
                      else -> cursor.toIntOrNull()?.takeIf { it in 0..all.size }
                          ?: return SourceResult.Err(SourceError.BadRequest("无效的游标：$cursor"))
                  }
                  val end = minOf(start + pageSize, all.size)
                  return SourceResult.Ok(Page(all.subList(start, end), end.takeIf { it < all.size }?.toString()))
              }
          }
