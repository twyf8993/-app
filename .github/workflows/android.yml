      # 固定签名缓存在 Actions 里，每次构建的 APK 都能直接覆盖安装
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: keystore/debug.jks
          key: shiguang-debug-keystore-v1

      - name: Create signing key if missing
        run: |
          if [ ! -f keystore/debug.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/debug.jks -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 仓库里没有提交 gradle-wrapper.jar，直接由 setup-gradle 安装指定版本
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle :app:testReleaseUnitTest --stacktrace

      # 正式包（release）经过 R8 优化，比调试包流畅
      - name: Build APK
        run: gradle :app:assembleRelease -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }} --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/shiguang-video-v0.1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: shiguang-video-apk
          path: dist/*.apk

      # 推送到 main 时发布 Release，手机浏览器可直接下载安装
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: 拾光影视 v0.1.${{ github.run_number }}
          files: dist/*.apk
          make_latest: true
          body: 手机下载下方 APK 安装。测试视频来自 Blender 基金会开放电影（CC BY）。
