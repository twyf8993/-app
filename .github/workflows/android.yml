          package com.shiguang.video.data.source

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertNull
          import org.junit.Test

          class PlaybackGuardTest {

              private fun playback(vararg streams: VideoStream, expiresAt: Long? = null) =
                  Playback("d01", 1, streams.toList(), expiresAtMillis = expiresAt)

              @Test
              fun picksHighestStreamWithinLimit() {
                  val result = PlaybackGuard.selectStream(
                      playback(VideoStream("a", 480), VideoStream("b", 1080), VideoStream("c", 2160)),
                      nowMillis = 0,
                  )
                  assertEquals(SourceResult.Ok(VideoStream("b", 1080)), result)
              }

              @Test
              fun fallsBackToUnknownThenLowest() {
                  assertEquals(
                      SourceResult.Ok(VideoStream("u")),
                      PlaybackGuard.selectStream(playback(VideoStream("c", 2160), VideoStream("u")), nowMillis = 0),
                  )
                  assertEquals(
                      SourceResult.Ok(VideoStream("c", 1440)),
                      PlaybackGuard.selectStream(playback(VideoStream("d", 2160), VideoStream("c", 1440)), nowMillis = 0),
                  )
              }

              @Test
              fun protectedStreamsAreNeverSelected() {
                  val mixed = playback(VideoStream("enc", 1080, protected = true), VideoStream("open", 720))
                  assertEquals(SourceResult.Ok(VideoStream("open", 720)), PlaybackGuard.selectStream(mixed, nowMillis = 0))

                  val onlyProtected = playback(VideoStream("enc", 1080, protected = true))
                  assertEquals(SourceResult.Err(SourceError.DrmProtected), PlaybackGuard.selectStream(onlyProtected, nowMillis = 0))
              }

              @Test
              fun expiredOrEmptyPlaybackIsRejected() {
                  assertEquals(
                      SourceResult.Err(SourceError.Expired),
                      PlaybackGuard.selectStream(playback(VideoStream("a", 720), expiresAt = 1_000), nowMillis = 1_000),
                  )
                  assertEquals(SourceResult.Err(SourceError.NotFound), PlaybackGuard.selectStream(playback(), nowMillis = 0))
              }

              @Test
              fun loginAndPaidEpisodesAreBlocked() {
                  assertNull(PlaybackGuard.checkAccess(EpisodeInfo("d01", 1, "第1集")))
                  assertEquals(SourceError.LoginRequired, PlaybackGuard.checkAccess(EpisodeInfo("d01", 2, "第2集", EpisodeAccess.LOGIN_REQUIRED)))
                  assertEquals(SourceError.PaymentRequired, PlaybackGuard.checkAccess(EpisodeInfo("d01", 3, "第3集", EpisodeAccess.PAID)))
              }
          }
