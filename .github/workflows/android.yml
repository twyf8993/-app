          package com.shiguang.video.data.source

          import com.shiguang.video.data.ContentType
          import com.shiguang.video.data.Drama

          /**
           * 片库数据源。界面只依赖这个接口，换成真实接口时新增一个实现即可，不改界面代码。
           *
           * 实现方只能通过官方或已获授权的渠道取数据：不伪造设备身份、不复现客户端签名、
           * 不绕过登录、付费、DRM 或频率限制。遇到这些限制时返回对应的 [SourceError]，
           * 由界面提示用户，而不是想办法绕过去。
           */
          interface ContentSource {
              val info: SourceInfo

              /** 按类型、题材筛选并排序，首页、分类、榜单共用 */
              suspend fun catalog(query: CatalogQuery, cursor: String? = null): SourceResult<Page<Drama>>

              suspend fun search(keyword: String, cursor: String? = null): SourceResult<Page<Drama>>

              suspend fun hotKeywords(): SourceResult<List<String>>

              suspend fun genres(): SourceResult<List<String>>

              suspend fun series(id: String): SourceResult<Drama>

              suspend fun related(id: String, limit: Int = 8): SourceResult<List<Drama>>

              suspend fun episodes(id: String, cursor: String? = null): SourceResult<Page<EpisodeInfo>>

              /** 取某一集的播放地址。返回的地址可能会过期，播放前用 [PlaybackGuard] 检查 */
              suspend fun playback(id: String, episode: Int): SourceResult<Playback>
          }

          data class SourceInfo(
              val name: String,
              /** 内容来源与授权说明，显示给用户 */
              val licenseNote: String,
          )

          enum class CatalogSort { HOT, NEWEST, SCORE }

          data class CatalogQuery(
              val type: ContentType? = null,
              val genre: String? = null,
              val sort: CatalogSort = CatalogSort.HOT,
          )

          data class Page<out T>(
              val items: List<T>,
              /** 下一页的游标，为空表示没有更多 */
              val nextCursor: String?,
          ) {
              val hasMore: Boolean get() = nextCursor != null
          }

          enum class EpisodeAccess {
              FREE,

              /** 需要用户在官方渠道登录 */
              LOGIN_REQUIRED,

              /** 需要会员或单集付费 */
              PAID,
          }

          data class EpisodeInfo(
              val dramaId: String,
              val number: Int,
              val title: String,
              val access: EpisodeAccess = EpisodeAccess.FREE,
          )

          data class VideoStream(
              val url: String,
              /** 画面高度，未知时为空 */
              val height: Int? = null,
              /** 加密流需要授权方提供的许可服务器才能播放，本应用不自行解密 */
              val protected: Boolean = false,
          )

          data class Playback(
              val dramaId: String,
              val episode: Int,
              val streams: List<VideoStream>,
              /** 片源署名，按授权要求显示在播放页 */
              val credit: String? = null,
              /** 地址过期时间（毫秒时间戳），为空表示不过期 */
              val expiresAtMillis: Long? = null,
          )

          sealed interface SourceError {
              data object NotFound : SourceError

              data class BadRequest(val message: String) : SourceError

              data object LoginRequired : SourceError

              data object PaymentRequired : SourceError

              data object DrmProtected : SourceError

              /** 播放地址已过期，需要重新请求 */
              data object Expired : SourceError

              data class RateLimited(val retryAfterSeconds: Long? = null) : SourceError

              data class Network(val cause: Throwable? = null) : SourceError

              data class Server(val code: Int, val message: String? = null) : SourceError
          }

          /** 只有频率限制和网络错误值得稍后重试，其余错误重试也不会变 */
          val SourceError.retryable: Boolean
              get() = this is SourceError.RateLimited || this is SourceError.Network

          /** 给用户看的提示文案 */
          val SourceError.userMessage: String
              get() = when (this) {
                  SourceError.NotFound -> "内容不存在或已下架"
                  is SourceError.BadRequest -> "请求参数有误"
                  SourceError.LoginRequired -> "该内容需要登录后观看"
                  SourceError.PaymentRequired -> "该内容为付费内容，请到官方渠道观看"
                  SourceError.DrmProtected -> "该内容受版权保护，暂不支持在本应用播放"
                  SourceError.Expired -> "播放地址已过期，请重试"
                  is SourceError.RateLimited -> "请求太频繁，请稍后再试"
                  is SourceError.Network -> "网络连接失败，请检查网络"
                  is SourceError.Server -> "服务暂时不可用（$code）"
              }

          sealed interface SourceResult<out T> {
              data class Ok<T>(val value: T) : SourceResult<T>

              data class Err(val error: SourceError) : SourceResult<Nothing>
          }

          inline fun <T, R> SourceResult<T>.map(transform: (T) -> R): SourceResult<R> = when (this) {
              is SourceResult.Ok -> SourceResult.Ok(transform(value))
              is SourceResult.Err -> this
          }

          fun <T> SourceResult<T>.getOrNull(): T? = (this as? SourceResult.Ok)?.value

          /**
           * 依次取完所有分页，最多 [maxPages] 页、[limit] 条。
           * 用于搜索结果、榜单、剧集列表这类一次要展示完整内容的地方；
           * 取到哪一页出错就把这个错误原样返回，界面据此提示并重试。
           */
          suspend fun <T> collectPages(
              maxPages: Int = 20,
              limit: Int = Int.MAX_VALUE,
              fetch: suspend (cursor: String?) -> SourceResult<Page<T>>,
          ): SourceResult<List<T>> {
              val items = mutableListOf<T>()
              var cursor: String? = null
              var pages = 0
              while (true) {
                  when (val result = fetch(cursor)) {
                      is SourceResult.Ok -> {
                          items += result.value.items.take(limit - items.size)
                          cursor = result.value.nextCursor
                      }
                      is SourceResult.Err -> return SourceResult.Err(result.error)
                  }
                  if (cursor == null || items.size >= limit) break
                  pages++
                  if (pages >= maxPages) break
              }
              return SourceResult.Ok(items)
          }
