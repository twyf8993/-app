                  val playback = source.playback(drama.id, 1).ok()
                  assertEquals(drama.id, playback.dramaId)
                  val stream = PlaybackGuard.selectStream(playback, nowMillis = System.currentTimeMillis()).ok()
                  assertTrue(stream.url.startsWith("https://"))
              }

              @Test
              fun outOfRangeEpisodeIsNotFound() = runBlocking<Unit> {
                  val drama = allCatalog().first()
                  assertEquals(SourceResult.Err(SourceError.NotFound), source.playback(drama.id, drama.episodeCount + 1))
              }

              @Test
              fun sourceDescribesItsLicense() {
                  assertTrue(source.info.name.isNotBlank())
                  assertTrue(source.info.licenseNote.isNotBlank())
              }
          }

          class MockContentSourceTest : ContentSourceContract() {
