          package com.shiguang.video.data.source

          import kotlinx.coroutines.runBlocking
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          /**
           * 所有数据源都要通过的约定测试。接入新数据源时继承这个类，换成新的 [createSource] 即可。
           * 真实接口的测试应改用录制好的响应，不要在单元测试里请求线上服务。
           */
          abstract class ContentSourceContract {

              abstract fun createSource(): ContentSource

              private val source by lazy { createSource() }

              private fun <T> SourceResult<T>.ok(): T = when (this) {
                  is SourceResult.Ok -> value
                  is SourceResult.Err -> throw AssertionError("期望成功，实际返回 $error")
              }

              private suspend fun allCatalog(query: CatalogQuery = CatalogQuery()) = buildList {
                  var cursor: String? = null
                  do {
                      val page = source.catalog(query, cursor).ok()
                      addAll(page.items)
                      cursor = page.nextCursor
                  } while (cursor != null)
              }

              @Test
              fun pagingCoversEverythingWithoutDuplicates() = runBlocking<Unit> {
                  val ids = allCatalog().map { it.id }
                  assertTrue(ids.isNotEmpty())
                  assertEquals(ids.size, ids.toSet().size)
              }

              @Test
              fun catalogHonoursFilterAndSort() = runBlocking<Unit> {
                  val first = allCatalog().first()
                  val byType = allCatalog(CatalogQuery(type = first.type))
                  assertTrue(byType.all { it.type == first.type })

                  val genre = first.genres.first()
                  assertTrue(allCatalog(CatalogQuery(genre = genre)).all { genre in it.genres })

                  val heats = allCatalog(CatalogQuery(sort = CatalogSort.HOT)).map { it.heat }
                  assertEquals(heats.sortedDescending(), heats)
              }

              @Test
              fun invalidCursorIsRejected() = runBlocking<Unit> {
                  val result = source.catalog(CatalogQuery(), "not-a-cursor")
                  assertTrue(result is SourceResult.Err && result.error is SourceError.BadRequest)
              }

              @Test
              fun blankSearchReturnsNothing() = runBlocking<Unit> {
                  assertTrue(source.search("   ").ok().items.isEmpty())
              }

              @Test
              fun searchFindsByTitle() = runBlocking<Unit> {
                  val drama = allCatalog().first()
                  assertTrue(source.search(drama.title).ok().items.any { it.id == drama.id })
              }

              @Test
              fun unknownSeriesIsNotFound() = runBlocking<Unit> {
                  assertEquals(SourceResult.Err(SourceError.NotFound), source.series("no-such-id"))
                  assertEquals(SourceResult.Err(SourceError.NotFound), source.playback("no-such-id", 1))
              }

              @Test
              fun episodesAreNumberedFromOne() = runBlocking<Unit> {
                  val drama = allCatalog().first()
                  val numbers = buildList {
                      var cursor: String? = null
                      do {
                          val page = source.episodes(drama.id, cursor).ok()
                          addAll(page.items.map { it.number })
                          cursor = page.nextCursor
                      } while (cursor != null)
                  }
                  assertEquals((1..drama.episodeCount).toList(), numbers)
              }

              @Test
              fun relatedExcludesItself() = runBlocking<Unit> {
                  val drama = allCatalog().first()
                  val related = source.related(drama.id, limit = 5).ok()
                  assertTrue(related.size <= 5)
                  assertFalse(related.any { it.id == drama.id })
              }

              @Test
              fun firstEpisodeHasPlayableStream() = runBlocking<Unit> {
