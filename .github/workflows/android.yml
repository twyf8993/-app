          import com.shiguang.video.ui.components.rememberSourceState
          import com.shiguang.video.ui.theme.AppColors

          private const val RANK_LIMIT = 15

          private enum class RankKind(val label: String, val sort: CatalogSort) {
              HOT("热播榜", CatalogSort.HOT),
              SCORE("好评榜", CatalogSort.SCORE),
              NEW("新剧榜", CatalogSort.NEWEST),
          }

          @Composable
          fun RankScreen(onOpenDrama: (String) -> Unit) {
              var kind by rememberSaveable { mutableStateOf(RankKind.HOT) }
              val source = rememberContentSource()

              // 榜单固定只取前 15 名
              val holder = rememberSourceState(kind) {
                  collectPages(limit = RANK_LIMIT) { cursor ->
                      source.catalog(CatalogQuery(sort = kind.sort), cursor)
                  }
              }
              val state = holder.state
              val list = (state as? SourceState.Ready)?.value.orEmpty()

              LazyColumn(
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(start = 20.dp, end = 20.dp, bottom = bottomContentPadding()),
                  verticalArrangement = Arrangement.spacedBy(14.dp),
              ) {
                  item {
                      Column(Modifier.statusBarsPadding().padding(top = 16.dp)) {
                          Text("榜单", fontSize = 26.sp, fontWeight = FontWeight.Black, color = AppColors.TextPrimary)
                          Spacer(Modifier.height(12.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                              RankKind.entries.forEach { k -> Pill(k.label, k == kind, { kind = k }) }
                          }
                      }
                  }

                  when (state) {
                      is SourceState.Loading -> item {
                          SourceLoading(
                              Modifier
                                  .fillMaxWidth()
                                  .height(200.dp),
                          )
                      }

                      is SourceState.Failed -> item {
                          SourceErrorState(
                              error = state.error,
                              onRetry = holder::retry,
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .height(220.dp),
                          )
                      }

                      is SourceState.Ready -> itemsIndexed(list, key = { _, d -> d.id }) { index, d ->
                          RankRow(index + 1, d, kind, onClick = { onOpenDrama(d.id) })
                      }
                  }
              }
          }

          @Composable
          private fun RankRow(rank: Int, drama: Drama, kind: RankKind, onClick: () -> Unit) {
              val rankColor = when (rank) {
                  1 -> Color(0xFFFFC53D)
                  2 -> Color(0xFFD9D9E0)
                  3 -> Color(0xFFE0915A)
                  else -> AppColors.TextSecondary
              }
              Row(
                  Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(12.dp))
                      .background(AppColors.Surface)
                      .clickable(onClick = onClick)
                      .padding(10.dp),
                  verticalAlignment = Alignment.CenterVertically,
              ) {
                  Text(
                      text = rank.toString(),
                      color = rankColor,
                      fontSize = 22.sp,
                      fontWeight = FontWeight.Black,
                      fontStyle = FontStyle.Italic,
                      modifier = Modifier.width(34.dp),
                  )
                  Poster(drama, Modifier.size(width = 64.dp, height = 88.dp), corner = 8.dp, showTitle = false)
                  Spacer(Modifier.width(12.dp))
                  Column(Modifier.weight(1f)) {
                      Text(drama.title, color = AppColors.TextPrimary, fontSize = 16.sp, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      Spacer(Modifier.height(4.dp))
                      Text(
                          "${drama.type.label} · ${drama.genres.joinToString(" · ")} · ${drama.episodeText}",
                          color = AppColors.TextSecondary,
                          fontSize = 12.sp,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                      )
                      Spacer(Modifier.height(6.dp))
                      Text(
                          text = when (kind) {
                              RankKind.SCORE -> "${drama.score} 分"
                              RankKind.NEW -> if (drama.updatedDaysAgo == 0) "今日更新" else "${drama.updatedDaysAgo} 天前更新"
                              RankKind.HOT -> drama.heatText
                          },
                          color = AppColors.Accent,
                          fontSize = 13.sp,
                          fontWeight = FontWeight.Medium,
                      )
                  }
              }
          }
