      - name: Generate data layer
        run: |
          f() { mkdir -p "$(dirname "$1")"; cat > "$1"; }
          S=app/src/main/java/com/shiguang/video

          f $S/data/Models.kt <<'__EOF__'
          package com.shiguang.video.data

          enum class ContentType(val label: String) {
              SHORT_DRAMA("短剧"),
              MOVIE("电影"),
              ANIME("漫剧"),
          }

          data class Drama(
              val id: String,
              val title: String,
              val type: ContentType,
              val genres: List<String>,
              val year: Int,
              val region: String,
              val episodeCount: Int,
              /** 热度，单位：万 */
              val heat: Int,
              val score: Double,
              val updatedDaysAgo: Int,
              val completed: Boolean,
              val intro: String,
              /** 决定程序生成海报的配色与纹理，不使用任何真实海报 */
              val posterSeed: Int,
              /** 封面地址，由数据源提供；为空或加载失败时回退到程序生成的海报 */
              val coverUrl: String? = null,
          ) {
              val heatText: String get() = "${heat}万热度"

              val episodeText: String
                  get() = when {
                      type == ContentType.MOVIE -> "电影"
                      completed -> "全${episodeCount}集"
                      else -> "更新至${episodeCount}集"
                  }
          }

          data class TestVideo(
              val title: String,
              val url: String,
              val credit: String,
          )

          data class Episode(
              val dramaId: String,
              val number: Int,
              val title: String,
              val video: TestVideo,
          )
