          package com.shiguang.video.data

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class ProgressPolicyTest {

              private fun ep(n: Int, pos: Long, dur: Long) = EpisodeProgress(n, pos, dur, updatedAt = 0)

              @Test
              fun finishedByFractionOrTail() {
                  assertTrue(ProgressPolicy.isFinished(95_000, 100_000))
                  assertTrue(ProgressPolicy.isFinished(93_000, 100_000)) // 不足 95%，但只剩 7 秒
                  assertFalse(ProgressPolicy.isFinished(300_000, 600_000))
                  assertFalse(ProgressPolicy.isFinished(10_000, 0)) // 时长未知
              }

              @Test
              fun shortClipDoesNotUseTailRule() {
                  // 20 秒的短片，播到第 13 秒不应算看完
                  assertFalse(ProgressPolicy.isFinished(13_000, 20_000))
              }

              @Test
              fun resumePosition() {
                  assertEquals(0L, ProgressPolicy.resumePositionMs(null))
                  assertEquals(0L, ProgressPolicy.resumePositionMs(ep(1, 1_500, 600_000))) // 太靠前
                  assertEquals(0L, ProgressPolicy.resumePositionMs(ep(1, 599_000, 600_000))) // 已看完，从头
                  assertEquals(125_000L, ProgressPolicy.resumePositionMs(ep(1, 125_000, 600_000)))
              }

              @Test
              fun continueEpisodeMovesToNextWhenFinished() {
                  val finished = DramaProgress("d", 3, mapOf(3 to ep(3, 600_000, 600_000)), 0)
                  assertEquals(4, ProgressPolicy.episodeToContinue(finished, episodeCount = 10))
                  // 最后一集看完则停留在最后一集
                  assertEquals(3, ProgressPolicy.episodeToContinue(finished, episodeCount = 3))

                  val halfway = DramaProgress("d", 3, mapOf(3 to ep(3, 200_000, 600_000)), 0)
                  assertEquals(3, ProgressPolicy.episodeToContinue(halfway, episodeCount = 10))
                  assertEquals(1, ProgressPolicy.episodeToContinue(null, episodeCount = 10))
              }

              @Test
              fun formatsDuration() {
                  assertEquals("00:00", formatDuration(0))
                  assertEquals("03:21", formatDuration(201_000))
                  assertEquals("1:02:03", formatDuration(3_723_000))
              }
          }
