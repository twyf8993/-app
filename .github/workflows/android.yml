          f $S/data/Repositories.kt <<'__EOF__'
          package com.shiguang.video.data

          import android.content.Context
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.update
          import org.json.JSONArray
          import org.json.JSONObject

          /**
           * 本地观看进度。每部剧一条 JSON 记录，内存中以 StateFlow 暴露，界面自动刷新。
           * 后续接入账号体系时，可在这里增加与服务端的同步。
           */
          class WatchProgressRepository(context: Context) {

              private val prefs = context.getSharedPreferences("watch_progress", Context.MODE_PRIVATE)
              private val _all = MutableStateFlow(loadAll())
              val all: StateFlow<Map<String, DramaProgress>> = _all.asStateFlow()

              fun get(dramaId: String): DramaProgress? = _all.value[dramaId]

              fun episode(dramaId: String, episode: Int): EpisodeProgress? = get(dramaId)?.episodes?.get(episode)

              fun save(
                  dramaId: String,
                  episode: Int,
                  positionMs: Long,
                  durationMs: Long,
                  now: Long = System.currentTimeMillis(),
              ) {
                  val old = get(dramaId)
                  val knownDuration = if (durationMs > 0) durationMs else old?.episodes?.get(episode)?.durationMs ?: 0L
                  val entry = EpisodeProgress(episode, positionMs.coerceAtLeast(0L), knownDuration, now)
                  val updated = DramaProgress(
                      dramaId = dramaId,
                      lastEpisode = episode,
                      episodes = old?.episodes.orEmpty() + (episode to entry),
                      updatedAt = now,
                  )
                  _all.update { it + (dramaId to updated) }
                  prefs.edit().putString(KEY_PREFIX + dramaId, encode(updated)).apply()
              }

              fun remove(dramaId: String) {
                  _all.update { it - dramaId }
                  prefs.edit().remove(KEY_PREFIX + dramaId).apply()
              }

              fun clear() {
                  val editor = prefs.edit()
                  _all.value.keys.forEach { editor.remove(KEY_PREFIX + it) }
                  editor.apply()
                  _all.value = emptyMap()
              }

              private fun loadAll(): Map<String, DramaProgress> =
                  prefs.all
                      .filterKeys { it.startsWith(KEY_PREFIX) }
                      .mapNotNull { (_, value) -> (value as? String)?.let(::decode) }
                      .associateBy { it.dramaId }

              private fun encode(p: DramaProgress): String {
                  val episodes = JSONArray()
                  p.episodes.values.forEach { e ->
                      episodes.put(
                          JSONObject()
                              .put("ep", e.episode)
                              .put("pos", e.positionMs)
                              .put("dur", e.durationMs)
                              .put("at", e.updatedAt),
                      )
                  }
                  return JSONObject()
                      .put("id", p.dramaId)
                      .put("last", p.lastEpisode)
                      .put("at", p.updatedAt)
                      .put("episodes", episodes)
                      .toString()
              }

              private fun decode(raw: String): DramaProgress? = runCatching {
                  val json = JSONObject(raw)
                  val arr = json.getJSONArray("episodes")
                  val episodes = (0 until arr.length()).associate { i ->
                      val e = arr.getJSONObject(i)
                      val ep = e.getInt("ep")
                      ep to EpisodeProgress(ep, e.getLong("pos"), e.getLong("dur"), e.getLong("at"))
                  }
                  DramaProgress(json.getString("id"), json.getInt("last"), episodes, json.getLong("at"))
              }.getOrNull()

              private companion object {
                  const val KEY_PREFIX = "p_"
              }
          }

          class SearchHistoryRepository(context: Context) {

              private val prefs = context.getSharedPreferences("search_history", Context.MODE_PRIVATE)
              private val _items = MutableStateFlow(load())
              val items: StateFlow<List<String>> = _items.asStateFlow()

              fun add(query: String) {
                  val q = query.trim()
                  if (q.isEmpty()) return
                  _items.update { (listOf(q) + it.filterNot { old -> old == q }).take(MAX) }
                  persist()
              }

              fun clear() {
                  _items.value = emptyList()
                  persist()
              }

              private fun load(): List<String> = runCatching {
                  val arr = JSONArray(prefs.getString(KEY, "[]"))
                  (0 until arr.length()).map { arr.getString(it) }
              }.getOrDefault(emptyList())

              private fun persist() {
                  prefs.edit().putString(KEY, JSONArray(_items.value).toString()).apply()
              }

              private companion object {
                  const val KEY = "items"
                  const val MAX = 12
              }
          }
