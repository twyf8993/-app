          f app/src/test/java/com/shiguang/video/data/source/CollectPagesTest.kt <<'__EOF__'
          package com.shiguang.video.data.source

          import kotlinx.coroutines.runBlocking
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class CollectPagesTest {

              private fun <T> ok(items: List<T>, next: String?) = SourceResult.Ok(Page(items, next))

              @Test
              fun walksEveryPageUntilExhausted() = runBlocking<Unit> {
                  val pages = listOf(ok(listOf(1, 2), "c1"), ok(listOf(3, 4), "c2"), ok(listOf(5), null))
                  val result = collectPages { cursor ->
                      when (cursor) {
                          null -> pages[0]
                          "c1" -> pages[1]
                          "c2" -> pages[2]
                          else -> SourceResult.Err(SourceError.BadRequest("bad cursor"))
                      }
                  }
                  assertEquals(SourceResult.Ok(listOf(1, 2, 3, 4, 5)), result)
              }

              @Test
              fun stopsAtLimit() = runBlocking<Unit> {
                  val result = collectPages(limit = 3) { cursor ->
                      when (cursor) {
                          null -> ok(listOf(1, 2), "c1")
                          else -> ok(listOf(3, 4), "c2")
                      }
                  }
                  assertEquals(SourceResult.Ok(listOf(1, 2, 3)), result)
              }

              @Test
              fun stopsAtMaxPages() = runBlocking<Unit> {
                  var calls = 0
                  val result = collectPages(maxPages = 2) { _ ->
                      calls++
                      ok(listOf(calls), "c$calls")
                  }
                  // 最多取 2 页：第一页 + 一次翻页
                  assertEquals(2, calls)
                  assertTrue(result is SourceResult.Ok)
              }

              @Test
              fun propagatesPageError() = runBlocking<Unit> {
                  val result = collectPages { cursor ->
                      if (cursor == null) ok(listOf(1), "c1") else SourceResult.Err(SourceError.Network())
                  }
                  assertTrue(result is SourceResult.Err && result.error is SourceError.Network)
              }
          }
