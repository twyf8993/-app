              val genres: List<String> = dramas.flatMap { it.genres }.distinct()

              val hotKeywords: List<String> = listOf("雾港来信", "长安小厨娘", "悬疑", "甜宠", "灵猫茶馆", "首富", "第七号站台", "穿越")

              fun find(id: String): Drama? = dramas.firstOrNull { it.id == id }

              fun episode(drama: Drama, number: Int): Episode {
                  val videos = TestVideos.all
                  val video = videos[(drama.posterSeed + number - 1).mod(videos.size)]
                  val title = if (drama.type == ContentType.MOVIE) "正片" else "第${number}集"
                  return Episode(drama.id, number, title, video)
              }

              fun search(query: String): List<Drama> {
                  val q = query.trim()
                  if (q.isEmpty()) return emptyList()
                  return dramas
                      .filter { d ->
                          d.title.contains(q, ignoreCase = true) ||
                              d.genres.any { it.contains(q) } ||
                              d.type.label.contains(q) ||
                              d.intro.contains(q)
                      }
                      .sortedWith(
                          compareByDescending<Drama> { it.title.contains(q, ignoreCase = true) }
                              .thenByDescending { it.heat },
                      )
              }

              fun related(drama: Drama, limit: Int = 8): List<Drama> =
                  dramas
                      .filter { it.id != drama.id }
                      .sortedByDescending { other -> other.genres.count { it in drama.genres } * 1000 + other.heat }
                      .take(limit)
          }
          __EOF__

          f $S/data/Progress.kt <<'__EOF__'
          package com.shiguang.video.data

          data class EpisodeProgress(
              val episode: Int,
              val positionMs: Long,
              val durationMs: Long,
              val updatedAt: Long,
          ) {
              val fraction: Float
                  get() = if (durationMs > 0) (positionMs.toFloat() / durationMs).coerceIn(0f, 1f) else 0f

              val finished: Boolean
                  get() = ProgressPolicy.isFinished(positionMs, durationMs)
          }

          data class DramaProgress(
              val dramaId: String,
              /** 最近一次播放的集数 */
              val lastEpisode: Int,
              val episodes: Map<Int, EpisodeProgress>,
              val updatedAt: Long,
          ) {
              val last: EpisodeProgress? get() = episodes[lastEpisode]
          }

          /** 观看进度相关的判定规则，不依赖 Android，便于单元测试。 */
          object ProgressPolicy {
              /** 播放比例达到该值即视为看完 */
              const val FINISH_FRACTION = 0.95f

              /** 距离结尾不足该时长也视为看完（片尾字幕） */
              const val FINISH_TAIL_MS = 8_000L

              /** 进度太靠前时直接从头播，不做续播 */
              const val MIN_RESUME_MS = 3_000L

              fun isFinished(positionMs: Long, durationMs: Long): Boolean {
                  if (durationMs <= 0) return false
                  if (positionMs.toFloat() / durationMs >= FINISH_FRACTION) return true
                  // 很短的视频不套用片尾规则，否则一开播就会被判定为看完
                  return durationMs > FINISH_TAIL_MS * 4 && durationMs - positionMs <= FINISH_TAIL_MS
              }

              fun resumePositionMs(progress: EpisodeProgress?): Long = when {
                  progress == null -> 0L
                  progress.finished -> 0L
                  progress.positionMs < MIN_RESUME_MS -> 0L
                  else -> progress.positionMs
              }

              /** “继续观看”应打开哪一集：上次那集已看完且还有下一集时，直接进入下一集。 */
              fun episodeToContinue(progress: DramaProgress?, episodeCount: Int): Int {
                  if (progress == null || episodeCount <= 0) return 1
                  val last = progress.last
                  return if (last != null && last.finished && progress.lastEpisode < episodeCount) {
                      progress.lastEpisode + 1
                  } else {
                      progress.lastEpisode.coerceIn(1, episodeCount)
                  }
              }
          }

          fun formatDuration(ms: Long): String {
              val total = (ms / 1000).coerceAtLeast(0)
              val h = total / 3600
              val m = (total % 3600) / 60
              val s = total % 60
              return if (h > 0) "%d:%02d:%02d".format(h, m, s) else "%02d:%02d".format(m, s)
          }
