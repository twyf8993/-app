# 拾光影视 · 手机上传用的单文件构建配置
# 放到仓库的 .github/workflows/android.yml，提交后 GitHub 会先生成全部源码，再构建 APK 并发布到 Releases。
name: Build Shiguang Video

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate project config and resources
        run: |
          f() { mkdir -p "$(dirname "$1")"; cat > "$1"; }

          f settings.gradle.kts <<'__EOF__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ShiguangVideo"
          include(":app")
          __EOF__

          f build.gradle.kts <<'__EOF__'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.0" apply false
          }
          __EOF__

          f gradle.properties <<'__EOF__'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          __EOF__

          f app/build.gradle.kts <<'__EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.shiguang.video"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.shiguang.video"
                  minSdk = 24
                  targetSdk = 35
                  // CI 通过 -PversionCode / -PversionName 传入构建序号，保证新包能覆盖安装
                  versionCode = (findProperty("versionCode") as String?)?.toIntOrNull() ?: 1
                  versionName = (findProperty("versionName") as String?) ?: "0.1.0"
              }

              signingConfigs {
                  // CI 会生成并缓存固定的调试签名；本地没有该文件时沿用默认调试签名
                  getByName("debug") {
                      val ks = rootProject.file("keystore/debug.jks")
                      if (ks.exists()) {
                          storeFile = ks
                          storePassword = "android"
                          keyAlias = "androiddebugkey"
                          keyPassword = "android"
                      }
                  }
              }

              buildTypes {
                  release {
                      // 正式包开启 R8 优化，Compose 界面比调试包流畅得多
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      // 沿用同一把签名，能直接覆盖安装之前的调试包，观看记录不会丢
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              lint {
                  // 省掉正式包构建前的检查，CI 构建快几分钟
                  checkReleaseBuilds = false
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.12.01")
              implementation(composeBom)

              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.navigation:navigation-compose:2.8.5")

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              implementation("androidx.compose.ui:ui-tooling-preview")
              debugImplementation("androidx.compose.ui:ui-tooling")

              implementation("androidx.media3:media3-exoplayer:1.5.1")
              implementation("androidx.media3:media3-ui:1.5.1")

              // 网络封面加载；没有封面或加载失败时回退到程序生成的海报
              implementation("io.coil-kt:coil-compose:2.7.0")

              testImplementation("junit:junit:4.13.2")
          }
          __EOF__

          f app/proguard-rules.pro <<'__EOF__'
          # 正式包开启了 R8。项目没有用反射，依赖库（Compose、Media3、Navigation）都自带混淆规则，这里不需要额外配置。
          __EOF__

          f app/src/main/AndroidManifest.xml <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:name=".ShiguangApp"
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Shiguang">

                  <!-- 全屏播放时会切换横竖屏，声明 configChanges 避免 Activity 重建打断播放 -->
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          __EOF__

          f app/src/main/res/values/strings.xml <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">拾光影视</string>
          </resources>
          __EOF__

          f app/src/main/res/values/themes.xml <<'__EOF__'
